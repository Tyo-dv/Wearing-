<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Animasi Rangkaian Starter dengan Relay</title>
<style>
:root{--bg:#eef3f8;--card:#ffffff;--fg:#14202e;--muted:#5b6b7c;--body:#2b3440;--accent:#1d6fd1;--btn:#1d6fd1;--btnfg:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0e1620;--card:#162231;--fg:#e8eef5;--muted:#93a4b6;--body:#3a4656;--accent:#5aa7ff;--btn:#5aa7ff;--btnfg:#07121f}}
:root[data-theme="dark"]{--bg:#0e1620;--card:#162231;--fg:#e8eef5;--muted:#93a4b6;--body:#3a4656;--accent:#5aa7ff;--btn:#5aa7ff;--btnfg:#07121f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.2rem;margin:4px 0 12px}
.card{background:var(--card);border-radius:14px;padding:10px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
svg{width:100%;height:auto;display:block}
.ctrl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}
button{background:var(--btn);color:var(--btnfg);border:0;border-radius:10px;padding:10px 18px;font-size:1rem;font-weight:600;cursor:pointer}
#status{background:var(--card);border-left:5px solid var(--accent);border-radius:8px;padding:10px 14px;font-size:.95rem;flex:1;min-width:220px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:22px;height:6px;border-radius:3px;vertical-align:middle;margin-right:5px}
.w{fill:none;stroke-width:6;stroke-linejoin:round;opacity:.35;transition:opacity .3s}
.w.on{opacity:1}
.f{fill:none;stroke:#fff;stroke-width:2.5;stroke-dasharray:8 14;stroke-linecap:round;display:none;animation:dash .5s linear infinite}
.f.on{display:block}
@keyframes dash{to{stroke-dashoffset:-22}}
.spin{transform-box:fill-box;transform-origin:center}
.spin.on{animation:rot .25s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.lbl{font-size:15px;font-weight:700;fill:var(--fg)}
.pin{font-size:15px;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
<h1>⚡ Animasi Rangkaian Starter dengan Relay</h1>
<div class="card">
<svg viewBox="0 0 680 760" role="img" aria-label="Rangkaian starter: baterai, kunci kontak, fuse, relay dan motor starter">
<!-- wires -->
<g id="wires"></g>

<!-- Starter motor -->
<text class="lbl" x="150" y="30">Motor Starter</text>
<rect x="140" y="90" width="160" height="50" rx="8" fill="#222"/>
<rect x="190" y="45" width="120" height="45" rx="6" fill="#8d96a0" id="sol"/>
<rect id="plunger" x="200" y="58" width="40" height="18" rx="3" fill="#cfd5db"/>
<g class="spin" id="gear"><circle cx="125" cy="115" r="15" fill="#aab2ba"/>
<g stroke="#555" stroke-width="4"><line x1="106" y1="115" x2="144" y2="115"/><line x1="125" y1="96" x2="125" y2="134"/><line x1="111" y1="101" x2="139" y2="129"/><line x1="139" y1="101" x2="111" y2="129"/></g></g>
<circle cx="310" cy="60" r="5" fill="#d22"/><circle cx="310" cy="80" r="5" fill="#f4c"/>

<!-- Relay -->
<rect x="140" y="320" width="140" height="110" rx="8" fill="var(--body)"/>
<path d="M175 320V405" stroke="#d98a4a" stroke-width="4" fill="none"/>
<path d="M245 320V345M245 380V385H140" stroke="#d98a4a" stroke-width="4" fill="none"/>
<path d="M245 345 l8 5 -16 6 16 6 -16 6 8 5" stroke="#d98a4a" stroke-width="3" fill="none"/>
<circle id="coil" cx="237" cy="365" r="26" fill="#ffd54a" opacity="0"/>
<line id="armOpen" x1="268" y1="410" x2="190" y2="386" stroke="#d98a4a" stroke-width="4" stroke-linecap="round"/>
<line id="armClosed" x1="268" y1="410" x2="178" y2="406" stroke="#d98a4a" stroke-width="4" stroke-linecap="round" style="display:none"/>
<text class="lbl" x="165" y="455">Relay</text>
<text class="pin" x="150" y="312" fill="#f4c" text-anchor="middle" dx="25">87</text>
<text class="pin" x="262" y="312" fill="#e8b800" text-anchor="middle">85</text>
<text class="pin" x="108" y="405" fill="var(--fg)" text-anchor="middle" dx="-4" style="display:none">86</text>
<text class="pin" x="124" y="372" fill="var(--fg)" text-anchor="end">86</text>
<text class="pin" x="292" y="434" fill="#e23" >30</text>

<!-- Fuse -->
<text class="lbl" x="500" y="300">FUSE</text>
<rect x="490" y="315" width="70" height="30" rx="5" fill="#4aa8e8"/>
<path d="M500 330 q10 -12 20 0 t20 0 t10 0" stroke="#fff" stroke-width="3" fill="none"/>
<circle id="fuseGlow" cx="525" cy="330" r="30" fill="#ffd54a" opacity="0"/>

<!-- Ignition -->
<rect x="480" y="500" width="120" height="75" rx="10" fill="#9aa4ae"/>
<line x1="510" y1="575" x2="510" y2="552" stroke="#333" stroke-width="4"/>
<line x1="570" y1="575" x2="570" y2="552" stroke="#333" stroke-width="4"/>
<line id="swOpen" x1="510" y1="552" x2="560" y2="530" stroke="#333" stroke-width="4" stroke-linecap="round"/>
<line id="swClosed" x1="510" y1="552" x2="570" y2="552" stroke="#333" stroke-width="4" stroke-linecap="round" style="display:none"/>
<g id="key" style="cursor:pointer"><g id="keyRot" style="transition:transform .3s;transform-box:fill-box;transform-origin:left center">
<circle cx="640" cy="525" r="22" fill="#111"/><circle cx="640" cy="525" r="7" fill="#888"/><rect x="598" y="520" width="30" height="10" rx="2" fill="#c9a24a"/></g></g>
<text class="lbl" x="520" y="620">Kunci Kontak</text>

<!-- Battery -->
<rect x="150" y="650" width="250" height="80" rx="8" fill="#1f252c"/>
<rect x="350" y="640" width="22" height="12" fill="#d22"/><rect x="180" y="640" width="22" height="12" fill="#222" stroke="#777"/>
<text x="361" y="638" font-size="18" font-weight="700" fill="#e23" text-anchor="middle">+</text>
<text x="191" y="638" font-size="18" font-weight="700" fill="var(--fg)" text-anchor="middle">−</text>
<text x="275" y="698" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Baterai 12V</text>
</svg>
</div>
<div class="ctrl">
<button id="btn">🔑 Putar Kunci (ON)</button>
<div id="status">Kunci OFF – tidak ada arus mengalir. Kontak relay terbuka.</div>
</div>
<div class="legend">
<span><i style="background:#e22"></i>Arus +  baterai</span><span><i style="background:#e8b800"></i>Arus kontrol (85)</span>
<span><i style="background:#f4c"></i>Pemicu solenoid (87)</span><span><i style="background:#222;border:1px solid #888"></i>Massa (−)</span>
</div>
</div>
<script>
var W=[
["M360 650V600","#e22","ctl"],["M360 600H510V575","#e22","ctl"],
["M570 575V330","#e8b800","ctl"],["M490 330H440V295H245V320","#e8b800","ctl"],
["M140 380H100V620H190V650","#222","ctl"],
["M360 600V410","#e22","rel"],["M360 410H280","#e22","rel"],
["M175 320V180H335V80H310","#f4c","rel"],
["M360 410V60H310","#e22","main"],["M160 140V160H100V380","#222","main"]];
var g=document.getElementById('wires'),NS='http://www.w3.org/2000/svg',els=[];
W.forEach(function(w){
 var b=document.createElementNS(NS,'path');b.setAttribute('d',w[0]);b.setAttribute('class','w');b.setAttribute('stroke',w[1]);b.dataset.g=w[2];g.appendChild(b);els.push(b);
 var f=document.createElementNS(NS,'path');f.setAttribute('d',w[0]);f.setAttribute('class','f');f.dataset.g=w[2];g.appendChild(f);els.push(f);
});
var on=false,timers=[],active={ctl:0,rel:0,main:0};
function $(i){return document.getElementById(i)}
function render(txt){
 els.forEach(function(e){e.classList.toggle('on',!!active[e.dataset.g])});
 $('coil').setAttribute('opacity',active.ctl?0.55:0);
 $('fuseGlow').setAttribute('opacity',active.ctl?0.5:0);
 $('swOpen').style.display=on?'none':'';$('swClosed').style.display=on?'':'none';
 $('armOpen').style.display=active.rel?'none':'';$('armClosed').style.display=active.rel?'':'none';
 $('gear').classList.toggle('on',!!active.main);
 $('plunger').setAttribute('x',active.rel?(active.main?250:225):200);
 $('sol').setAttribute('fill',active.rel?'#f0a030':'#8d96a0');
 $('keyRot').style.transform=on?'rotate(-35deg)':'none';
 $('btn').textContent=on?'⏹ Kembalikan Kunci (OFF)':'🔑 Putar Kunci (ON)';
 if(txt)$('status').textContent=txt;
}
function set(v){
 timers.forEach(clearTimeout);timers=[];on=v;
 if(!v){active={ctl:0,rel:0,main:0};render('Kunci OFF – tidak ada arus mengalir. Kontak relay terbuka.');return}
 active={ctl:1,rel:0,main:0};
 render('① Kunci ON: arus dari baterai (+) → kunci → fuse → pin 85 → koil relay → pin 86 → massa (−).');
 timers.push(setTimeout(function(){active.rel=1;render('② Koil relay menjadi magnet dan menarik kontak: pin 30 terhubung ke pin 87, arus mengalir ke solenoid (kabel pink).')},1800));
 timers.push(setTimeout(function(){active.main=1;render('③ Solenoid menutup kontak utama: arus besar langsung dari baterai (+) ke motor starter, motor berputar dan mesin di-crank.')},3600));
}
$('btn').onclick=function(){set(!on)};
$('key').onclick=function(){set(!on)};
render();
</script>
</body>
</html>
